name: LeetCode Daily Checkin

on:
  schedule:
    # 每天北京时间 08:30 自动执行 (对应 UTC 00:30)
    - cron: '17 0 * * *'
  workflow_dispatch: # 支持在 GitHub 网页上手动点击一键触发测试

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests

      - name: 执行每日一题自动打卡
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          CSRF_TOKEN: ${{ secrets.CSRF_TOKEN }}
          DRY_RUN: 'false'
        run: |
          python leetcode_checkin.py
